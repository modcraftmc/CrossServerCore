plugins{
    id 'com.gradleup.shadow' version '8.3.6'
}

apply plugin: 'com.gradleup.shadow'

group = 'fr.modcraftmc'
if(project.release_type == "snapshot") {
    version = "${minecraft_version}-${mod_version}-SNAPSHOT"
} else{
    version = "${minecraft_version}-${mod_version}"
}

configurations {
    // Create the library configuration, where our non-mod libraries will be added to
    library
    // Any dependency in the library configuration will also be added to the implementation configuration
    implementation.extendsFrom library

    shade
    library.extendsFrom shade
}

dependencies {
    //shade project(path: ':cross-server-core-api')

//    shade(group: 'com.rabbitmq', name: 'amqp-client', version: '[5.16.0,)')
//    shade(group: 'org.mongodb', name: 'mongodb-driver-sync', version: '[5.3.0,)')
//    shade(group: 'com.moandjiezana.toml', name: 'toml4j', version: '[0.7.0,)')
    jarJar(implementation(group: 'com.rabbitmq', name: 'amqp-client', version: '[5.16.0,)'))
    jarJar(implementation(group: 'org.mongodb', name: 'mongodb-driver-sync', version: '[5.3.0,)'))
    jarJar(implementation(group: 'com.moandjiezana.toml', name: 'toml4j', version: '[0.7.0,)'))
}



